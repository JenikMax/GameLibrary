<title>CRT Background — 40 вариантов (Retro Terminal)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  font-family: 'Courier New', Courier, monospace;
  background: #000;
  color: #00cc6a;
  padding: 2rem;
}
h1 {
  text-align: center;
  margin-bottom: 0.25rem;
  font-size: 1.3rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #00ff88;
  text-shadow: 0 0 10px rgba(0,255,136,0.3);
}
.sub {
  text-align: center;
  margin-bottom: 2rem;
  color: #00aa55;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
}
.card {
  border: 1px solid rgba(0,255,136,0.15);
  background: rgba(0,26,13,0.5);
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.card:hover {
  box-shadow: 0 0 20px rgba(0,255,136,0.08);
  border-color: rgba(0,255,136,0.3);
}
.card-header {
  padding: 0.5rem 0.75rem;
  background: rgba(0,20,10,0.6);
  border-bottom: 1px solid rgba(0,255,136,0.1);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-transform: uppercase;
}
.card-header .num {
  display: inline-block;
  background: rgba(0,255,136,0.15);
  color: #00ff88;
  padding: 0 6px;
  font-size: 0.6rem;
  font-weight: bold;
}
.card-header .name {
  color: #00cc6a;
}

/* ============ CRT PREVIEW ============ */
.crt-preview {
  position: relative;
  width: 100%;
  height: 180px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.crt-preview .sample-text {
  position: relative;
  z-index: 5;
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  text-align: center;
  padding: 0 0.5rem;
  line-height: 1.6;
  pointer-events: none;
  text-shadow: 0 0 6px currentColor;
}
.crt-preview .sample-text .prompt {
  opacity: 0.6;
  font-size: 0.6rem;
}
.crt-preview .sample-text .cursor {
  display: inline-block;
  width: 0.4em;
  height: 0.75em;
  background: currentColor;
  margin-left: 2px;
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 50% { opacity: 0; } }
.scanlines { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.glow { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.interference { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0.03; }
</style>

function buildPreview(v) {
  const p = document.createElement('div');
  p.className = 'crt-preview';
  p.style.background = v.bg;

  // glow layer
  if (v.gl) {
    const gl = document.createElement('div');
    gl.className = 'glow';
    gl.style.background = v.gl;
    if (v.glowExtra) gl.style.boxShadow = v.glowExtra;
    p.appendChild(gl);
  }

  // scanlines
  if (v.scan) {
    const sc = document.createElement('div');
    sc.className = 'scanlines' + (v.cls && !v.cls.startsWith('crt-') ? ' ' + v.cls : '');
    sc.style.background = v.scan;
    p.appendChild(sc);
  }

  // extra layer
  if (v.extra) {
    const ex = document.createElement('div');
    ex.className = 'scanlines';
    ex.style.background = v.extra;
    p.appendChild(ex);
  }

  // dot mask
  if (v.dots) {
    const dt = document.createElement('div');
    dt.className = 'scanlines';
    dt.style.background = v.dots;
    dt.style.backgroundSize = v.dotSize || '4px 4px';
    p.appendChild(dt);
  }

  // burn-in
  if (v.burn) {
    const br = document.createElement('div');
    br.className = 'scanlines';
    br.style.background = v.burn;
    p.appendChild(br);
  }

  // reflection
  if (v.reflect) {
    const rf = document.createElement('div');
    rf.className = 'scanlines';
    rf.style.background = v.reflect;
    p.appendChild(rf);
  }

  // interference effects
  if (v.id === 28 || v.id === 40) {
    const nz = document.createElement('div');
    nz.className = 'interference';
    nz.style.cssText = "background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E\"); background-size: 128px 128px; opacity: 1;";
    p.appendChild(nz);
  }
  if (v.id === 31) {
    const dz = document.createElement('div');
    dz.className = 'interference';
    dz.style.cssText = "background: repeating-radial-gradient(circle at 20% 30%, rgba(0,255,136,0.008) 0, transparent 1px), repeating-radial-gradient(circle at 70% 60%, rgba(0,255,136,0.005) 0, transparent 1px); background-size: 60px 60px, 90px 90px; opacity: 1;";
    p.appendChild(dz);
  }
  if (v.id === 32) {
    const em = document.createElement('div');
    em.className = 'interference';
    em.style.cssText = "background: repeating-linear-gradient(40deg, transparent, transparent 15px, rgba(0,255,136,0.008) 15px, rgba(0,255,136,0.008) 17px, transparent 17px, transparent 30px); background-size: 200% 200%; animation: emiDrift 4s linear infinite; opacity: 1;";
    p.appendChild(em);
  }
  if (v.id === 17) {
    p.style.animation = 'flicker60 0.016s infinite';
  }
  if (v.id === 18) {
    p.style.animation = 'flicker100 0.01s infinite';
  }

  // vignette
  if (v.vig) {
    const vg = document.createElement('div');
    vg.className = 'vignette';
    vg.style.background = v.vig;
    p.appendChild(vg);
  }

  // sample text
  const txt = document.createElement('div');
  txt.className = 'sample-text';
  txt.style.color = v.color;
  txt.innerHTML = `
    <div style="font-size:0.8rem;font-weight:bold;letter-spacing:0.12em">GAME-LIBRARY</div>
    <div class="prompt" style="margin-top:4px">root@crt:~$ <span style="opacity:0.8">cat /dev/phosphor</span></div>
    <div class="prompt" style="opacity:0.4">initializing crt v${v.id}...</div>
    <div class="prompt" style="opacity:0.6">&gt; <span class="cursor"></span></div>
  `;
  p.appendChild(txt);

  return p;
}

const grid = document.getElementById('app');
VARIANTS.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';

  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.innerHTML = '<span class="num">#' + String(v.id).padStart(2,'0') + '</span><span class="name">' + v.name + '</span>';
  card.appendChild(hdr);

  const preview = buildPreview(v);
  card.appendChild(preview);

  grid.appendChild(card);
});

const style = document.createElement('style');
style.textContent = `
@keyframes flicker60 {
  0%, 49% { opacity: 1; }
  50%, 51% { opacity: 0.97; }
  52%, 100% { opacity: 1; }
}
@keyframes flicker100 {
  0%, 9% { opacity: 1; }
  10%, 11% { opacity: 0.985; }
  12%, 100% { opacity: 1; }
}
@keyframes emiDrift {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}
`;
document.head.appendChild(style);
