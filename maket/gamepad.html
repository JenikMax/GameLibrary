<div class="terminal-container">
  <!-- Точный векторный геймпад Xbox -->
  <svg class="retro-gamepad" viewBox="0 0 100 80" xmlns="http://w3.org">
    <!-- Корпус геймпада с анатомическими рукоятками -->
    <path class="glow-path" d="M 30,10 C 40,8 60,8 70,10 C 82,12 95,20 93,42 C 91,58 83,75 76,75 C 71,75 67,65 64,58 C 58,54 42,54 36,58 C 33,65 29,75 24,75 C 17,75 9,58 7,42 C 5,20 18,12 30,10 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
    
    <!-- Центральная кнопка Xbox (сфера) -->
    <circle cx="50" cy="22" r="4.5" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M 48.5,20.5 C 49,22 51,22 51.5,20.5 M 47.5,21.5 C 49,23.5 51,23.5 52.5,21.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
    
    <!-- Левый стик (смещен вверх) -->
    <circle cx="25" cy="28" r="6" fill="none" stroke="currentColor" stroke-width="1"/>
    <circle cx="25" cy="28" r="4" fill="none" stroke="currentColor" stroke-dasharray="1,1" stroke="currentColor" stroke-width="0.8"/>
    
    <!-- Правый стик (смещен вниз) -->
    <circle cx="62" cy="44" r="6" fill="none" stroke="currentColor" stroke-width="1"/>
    <circle cx="62" cy="44" r="4" fill="none" stroke="currentColor" stroke-dasharray="1,1" stroke="currentColor" stroke-width="0.8"/>
    
    <!-- Гибридная крестовина D-Pad -->
    <circle cx="38" cy="44" r="5" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,1"/>
    <path d="M 38,39 L 38,49 M 33,44 L 43,44" stroke="currentColor" stroke-width="1.5"/>
    
    <!-- Кнопки ABXY (ромбом) -->
    <circle cx="75" cy="22" r="2" fill="none" stroke="currentColor" stroke-width="1"/> <!-- Y -->
    <circle cx="69" cy="28" r="2" fill="none" stroke="currentColor" stroke-width="1"/> <!-- X -->
    <circle cx="81" cy="28" r="2" fill="none" stroke="currentColor" stroke-width="1"/> <!-- B -->
    <circle cx="75" cy="34" r="2" fill="none" stroke="currentColor" stroke-width="1"/> <!-- A -->
    
    <!-- Кнопки Menu и View -->
    <circle cx="43" cy="30" r="1" fill="currentColor"/>
    <circle cx="57" cy="30" r="1" fill="currentColor"/>
  </svg>
</div>
