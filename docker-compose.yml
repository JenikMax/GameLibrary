# ============================================================
# docker-compose.yml — 5 сервисов GameLibrary
# postgresdb, backend, ai-service, frontend, transmission
# ============================================================

services:
  # ─── PostgreSQL 16 + pgvector ────────────────────────────
  postgresdb:
    build:
      context: .
      dockerfile: ./postgresdb/Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/db/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    mem_limit: 512m

  # ─── Spring Boot Backend ─────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgresdb
      - DB_PORT=5432
      # ⚠️ TRACKER_ANNOUNCE_URL — IP машины, на которой запущен backend (трекер).
      # Должен быть доступен из ваших торрент-клиентов. Замените на актуальный IP.
      - TRACKER_ANNOUNCE_URL=http://localhost:8080/game-library/api/tracker/announce
      - TRANSMISSION_RPC_URL=http://transmission:9091/transmission/rpc
      - TRANSMISSION_DOWNLOAD_DIR=/downloads
      - GAMES_DIRECTORY=/gameLibrary
      - IMAGES_DIRECTORY=/gameLibrary/images
      - SCRAPER_CONFIG_DIR=/scraper-config
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET}
      # ⚠️ SCRAPER_ENCRYPTION_KEY — ключ шифрования API-ключей скраперов.
      # При смене нужно пересохранить ключи в админке.
      - SCRAPER_ENCRYPTION_KEY=${SCRAPER_ENCRYPTION_KEY}
      - DB_PASSWORD=${DB_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - TTORRENT_HASHING_THREADS=2  # Потоки для хэширования торрентов (зарезервировано)
    volumes:
      # Корень библиотеки игр (games/, images/)
      - /host_mnt/f/Work/Git/my_project/data:/gameLibrary
      # Временная директория для .torrent-файлов
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/tracker/torrents:/torrentDirTmp
      # Конфигурация скраперов (scrapers-config.json)
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/scrapers:/scraper-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/game-library/api/images/games/0/logo"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgresdb:
        condition: service_healthy
      transmission:
        condition: service_started
    restart: always
    mem_limit: 1024m

  # ─── AI-сервис (Python FastAPI) ──────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Кэш моделей HuggingFace (автозагрузка при первом запуске)
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/models:/models
    environment:
      - MODELS_DIR=/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always
    mem_limit: 3072m  # PyTorch + модели (NLLB-200 + e5 ≈ 2.5GB, runtime buffer)
    cpu_shares: 512

  # ─── Frontend (Vue SPA → Nginx) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 64m

  # ─── Transmission (BitTorrent seeder) ────────────────────
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.2
    container_name: transmission
    ports:
      - "9091:9091"     # RPC (веб-интерфейс)
      - "51413:51413"    # TCP для P2P-соединений
      - "51413:51413/udp" # UDP для DHT/uTP
    volumes:
      # Файлы игр для раздачи (та же директория, что и GAMES_DIRECTORY)
      - /host_mnt/f/Work/Git/my_project/data/games:/downloads/games
      # Настройки Transmission (settings.json)
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/tracker/config:/config
      # Авто-добавление .torrent-файлов
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/tracker/watch:/watch
      # Завершённые загрузки
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/tracker/complete:/downloads/complete
      # Незавершённые загрузки (докачка)
      - /host_mnt/f/Work/Git/my_project/data/gameLibraryConfigs/tracker/incomplete:/downloads/incomplete
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - TRANSMISSION_DOWNLOAD_DIR=/downloads/complete
      - TRANSMISSION_INCOMPLETE_DIR=/downloads/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true
      - TRANSMISSION_WATCH_DIR=/watch
      - TRANSMISSION_WATCH_DIR_ENABLED=true
      - DHT=true   # Роуминг DHT
      - LPD=true   # Локальное обнаружение пиров
      - PEX=true   # Обмен пирами через PEX
    mem_limit: 256m
    restart: always
