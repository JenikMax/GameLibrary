# ============================================================
# nginx.conf — Раздача Vue SPA и прокси на backend
# Используется в production (контейнер frontend).
# ============================================================

# HTTP-сервер (без HTTPS, для внутренней сети Docker)
server {
    listen 80;
    server_name localhost;

    server_tokens off;  # Скрыть версию Nginx

    root /usr/share/nginx/html;
    index index.html;

    # Перенаправление корня на SPA-базовый путь
    location = / {
        return 301 /game-library/;
    }

    # Статические ассеты Vue SPA (кэшируются браузером)
    location /game-library/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    # Vue SPA — все маршруты /game-library/* отдают index.html
    location /game-library {
        try_files $uri $uri/ /index.html;
    }

    # EmulatorJS (self-hosted WASM-ядра) — статика из контейнера emulatorjs
    # COOP/COEP включают многопоточные ядра (SharedArrayBuffer): только здесь,
    # чтобы не затрагивать SPA (YouTube-трейлеры и т.п.)
    location /game-library/emu/ {
        proxy_pass http://emulatorjs:80/emu/;
        proxy_set_header Host $host;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Прокси API-запросов на backend
    location /game-library/api/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8080;

        # Длинные таймауты для больших файлов и стриминга
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;

        # Передача заголовков клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключение буферизации для стриминга ZIP-архивов
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Статические ресурсы бэкенда (Thymeleaf-страницы, устаревшие)
    location /game-library/css/ { proxy_pass http://backend:8080; }
    location /game-library/js/ { proxy_pass http://backend:8080; }
    location /game-library/img/ { proxy_pass http://backend:8080; }
    location /game-library/resources/ { proxy_pass http://backend:8080; }

    # Swagger UI и OpenAPI docs
    location /game-library/swagger-ui/ { proxy_pass http://backend:8080; }
    location /game-library/v3/ { proxy_pass http://backend:8080; }
    location /game-library/swagger-ui.html { proxy_pass http://backend:8080; }
}
